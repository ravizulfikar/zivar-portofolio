<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="zivarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <radialGradient id="zivarGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0" />
    </radialGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4338CA" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Base with Glow -->
  <rect width="512" height="512" rx="128" fill="url(#zivarGrad)" filter="url(#logoShadow)" />
  <rect width="512" height="512" rx="128" fill="url(#zivarGlow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="10" y="10" width="492" height="492" rx="118" fill="none" stroke="#C7D2FE" stroke-width="5" stroke-opacity="0.4" />

  <!-- Monogram RZ Geometry -->
  <g fill="#FFFFFF">
    <!-- Letter R -->
    <path d="M 112 136 C 112 125 121 116 132 116 L 224 116 C 268 116 298 142 298 184 C 298 218 274 242 242 250 L 298 364 C 303 374 296 386 284 386 L 240 386 C 232 386 226 381 222 374 L 176 270 L 164 270 L 164 366 C 164 377 155 386 144 386 L 132 386 C 121 386 112 377 112 366 Z M 164 168 L 164 222 L 216 222 C 238 222 248 210 248 195 C 248 180 238 168 216 168 Z" />
    
    <!-- Letter Z -->
    <path d="M 284 136 C 284 125 293 116 304 116 L 396 116 C 407 116 416 125 416 136 L 416 162 C 416 171 411 179 403 184 L 332 294 L 396 294 C 407 294 416 303 416 314 L 416 366 C 416 377 407 386 396 386 L 294 386 C 283 386 274 377 274 366 L 274 340 C 274 331 279 323 287 318 L 358 208 L 304 208 C 293 208 284 199 284 188 Z" />
  </g>

  <!-- Active Status / Developer Indicator -->
  <circle cx="416" cy="96" r="26" fill="#10B981" stroke="#4338CA" stroke-width="8" />
  <circle cx="416" cy="96" r="10" fill="#A7F3D0" />
</svg>
